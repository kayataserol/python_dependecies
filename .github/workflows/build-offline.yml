name: Claude Offline Windows 11 Python 3.13

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: windows-latest

    steps:
      - name: Setup Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Verify environment
        shell: pwsh
        run: |
          python --version
          python -c "import platform; print(platform.architecture())"
          node --version
          npm --version

      - name: Download six GitHub projects
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/repos

          $repos = @{
            "karpathy" = "multica-ai/andrej-karpathy-skills"
            "superpowers" = "obra/superpowers"
            "graphify" = "Graphify-Labs/graphify"
            "understand-anything" = "Egonex-AI/Understand-Anything"
            "book-to-skill" = "virgiliojr94/book-to-skill"
            "pake" = "tw93/Pake"
          }

          foreach ($name in $repos.Keys) {
            $repo = $repos[$name]

            git clone --depth 1 `
              "https://github.com/$repo.git" `
              "package/repos/$name"

            if ($LASTEXITCODE -ne 0) {
              throw "Git clone failed: $repo"
            }

            $commit = git -C "package/repos/$name" rev-parse HEAD
            "$repo $commit" | Out-File package/versions.txt -Append

            Remove-Item "package/repos/$name/.git" -Recurse -Force
          }

      - name: Download Python 3.13 AMD64 wheels
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/wheels

          python -m pip download `
            --dest package/wheels `
            --platform win_amd64 `
            --python-version 3.13 `
            --implementation cp `
            --abi cp313 `
            --only-binary=:all: `
            graphifyy `
            pymupdf `
            python-docx `
            ebooklib

          if ($LASTEXITCODE -ne 0) {
            throw "Python wheel download failed"
          }

      - name: Download Pake CLI package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/npm

          npm pack pake-cli --pack-destination package/npm

          if ($LASTEXITCODE -ne 0) {
            throw "Pake CLI download failed"
          }

      - name: Create package documentation
        shell: pwsh
        run: |
          @'
          CLAUDE OFFLINE PACKAGE
          ======================

          Target OS:
          Windows 11 AMD64 / x86-64

          Python:
          CPython 3.13, 64-bit

          Included:
          - Six GitHub source repositories
          - Python 3.13 compatible wheel packages
          - Pake CLI npm archive
          - Source commit information

          IMPORTANT:
          This is a transfer bundle, not a
          complete offline installation.

          Node/Rust dependencies for Pake
          are not fully bundled.

          Check other runtime dependencies
          before installing.

          Python offline installation example:

          python -m pip install --no-index
            --find-links wheels graphifyy

          Review all scripts and permissions
          before execution.
          '@ | Set-Content package/README.txt

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Offline-Win11-AMD64-Py313
          path: package/
          retention-days: 7
