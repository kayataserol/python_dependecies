name: Claude Offline Bundle V2 Win11 Py313

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Prepare directories
        shell: pwsh
        run: |
          $dirs = @('bundle/repos', 'bundle/wheels', 'bundle/pake-runtime', 'bundle/reports')
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force $d | Out-Null }
          python -VV | Out-File bundle/reports/python.txt
          node --version | Out-File bundle/reports/node.txt
          npm --version | Out-File bundle/reports/npm.txt

      - name: Download official repositories and record commits
        shell: pwsh
        run: |
          $repos = [ordered]@{
            'karpathy' = 'multica-ai/andrej-karpathy-skills'
            'superpowers' = 'obra/superpowers'
            'graphify' = 'Graphify-Labs/graphify'
            'understand-anything' = 'Egonex-AI/Understand-Anything'
            'book-to-skill' = 'virgiliojr94/book-to-skill'
            'pake' = 'tw93/Pake'
          }
          foreach ($name in $repos.Keys) {
            $repo = $repos[$name]
            git clone --depth 1 "https://github.com/$repo.git" "bundle/repos/$name"
            if ($LASTEXITCODE -ne 0) { throw "Failed to clone $repo" }
            $hash = git -C "bundle/repos/$name" rev-parse HEAD
            "$repo $hash" | Out-File -Append bundle/reports/source-commits.txt
            Remove-Item "bundle/repos/$name/.git" -Recurse -Force
          }

      - name: Download Windows CPython 3.13 wheels
        shell: pwsh
        run: |
          python -m pip download --dest bundle/wheels `
            --platform win_amd64 --python-version 3.13 `
            --implementation cp --abi cp313 `
            --only-binary=:all: `
            graphifyy pymupdf python-docx ebooklib
          if ($LASTEXITCODE -ne 0) { throw 'Missing mandatory Python wheels' }
          Get-ChildItem bundle/wheels -File | Select-Object Name, Length |
            Format-Table -AutoSize | Out-String | Set-Content bundle/reports/wheels.txt

      - name: Prepare Pake npm runtime dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pake-stage | Out-Null
          Push-Location pake-stage
          npm init -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'npm init failed' }
          npm install pake-cli --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pake npm dependency resolution failed' }
          Pop-Location
          Copy-Item pake-stage/node_modules bundle/pake-runtime/node_modules -Recurse
          Copy-Item pake-stage/package.json bundle/pake-runtime/package.json
          Copy-Item pake-stage/package-lock.json bundle/pake-runtime/package-lock.json
          node -p "require('./pake-stage/node_modules/pake-cli/package.json').version" |
            Set-Content bundle/reports/pake-cli-version.txt

      - name: Verify offline Python installation
        shell: pwsh
        run: |
          python -m venv testenv
          & ./testenv/Scripts/python.exe -m pip install --no-index `
            --find-links bundle/wheels graphifyy pymupdf python-docx ebooklib
          if ($LASTEXITCODE -ne 0) { throw 'Offline wheel verification failed' }
          & ./testenv/Scripts/python.exe -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency check failed' }
          'Offline Python install: PASS' | Set-Content bundle/reports/python-offline-test.txt

      - name: Write installation notes
        shell: pwsh
        run: |
          @'
          CLAUDE OFFLINE BUNDLE V2
          Target: Windows 11 AMD64, CPython 3.13

          This artifact contains:
          repos/        Six project source snapshots
          wheels/       Python dependencies with an offline install test
          pake-runtime/ npm CLI dependency tree (installed with --ignore-scripts)
          reports/      Versions and test results

          SECURITY:
          Inspect third-party skills, scripts and hooks before enabling.
          No automatic installation or edits to Claude configuration.

          LIMITATIONS:
          - Python test verifies the listed PyPI wheels only.
          - book-to-skill's full optional extractor dependency set is not
            automatically resolved from its repository by this workflow.
          - Superpowers and other plugins may need local Claude registration
            and hooks; repository source alone is not a plugin installation.
          - Node.js itself is NOT bundled.
          - pake-runtime has npm dependencies but install scripts were skipped.
          - Rust, MSVC, WebView2 and Tauri build caches are NOT bundled.
          - Pake desktop app compilation is NOT guaranteed offline.

          Preserve all folders, including hidden metadata directories.
          '@ | Set-Content bundle/README-OFFLINE.txt

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: Claude-Offline-V2-Win11-AMD64-Py313
          path: bundle/
          include-hidden-files: true
          retention-days: 7
